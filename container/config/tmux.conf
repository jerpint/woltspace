# woltspace tmux defaults — the lodge's shared walls.
#
# Bring your own setup: /workspace/wolts/tmux.conf.local is sourced LAST and
# wins (on your host: ~/.woltspace/wolts/tmux.conf.local). It lives in your
# wolts mount, so it survives rebuilds. Prefix stays C-b here — remap it (and
# anything else) in your local file.
#
# Installed at /etc/tmux.conf so every tmux server reads it regardless of the
# per-wolt HOME a session runs under.

# terminal niceties
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm*:Tc"
set -s escape-time 10
set -g history-limit 50000

# status line — forest edition
set -g status on
set -g status-interval 30
set -g status-style "bg=#2A2620,fg=#8A8378"
set -g status-left-length 48
set -g status-left "#[fg=#C98B2A,bold] 🌲 #S #[fg=#57504A]│"
set -g status-right-length 40
set -g status-right "#[fg=#7FA98A]#{?client_prefix,· prefix ,}#[fg=#8A8378]woltspace #[fg=#C98B2A,bold]%H:%M "
setw -g window-status-format "#[fg=#8A8378]  #I #W "
setw -g window-status-current-format "#[fg=#E07B4A,bold]  #I #W "

# your lodge, your keys — user overlay (quiet if absent)
source-file -q /workspace/wolts/tmux.conf.local
