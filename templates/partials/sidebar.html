<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-name">
      <span class="brand-emoji">🦫</span>
      Woltspace
    </div>
  </div>

  <div class="sidebar-nav">
    <a class="sidebar-nav-item{% if active_nav == 'home' %} active{% endif %}" id="nav-home" href="/" onclick="showView('home');return false">
      <span class="sidebar-nav-icon">🏠</span>
      <span class="sidebar-nav-label">Home</span>
    </a>
    <a class="sidebar-nav-item{% if active_nav == 'apps' %} active{% endif %}" id="nav-apps" href="/?view=apps" onclick="showView('apps');return false">
      <span class="sidebar-nav-icon">🪓</span>
      <span class="sidebar-nav-label">Apps</span>
    </a>
    <a class="sidebar-nav-item{% if active_nav == 'wolves' %} active{% endif %}" id="nav-wolves" href="/wolves">
      <span class="sidebar-nav-icon">🐺</span>
      <span class="sidebar-nav-label">Wolves</span>
    </a>
    <a class="sidebar-nav-item{% if active_nav == 'connectors' %} active{% endif %}" id="nav-connectors" href="/connectors">
      <span class="sidebar-nav-icon">🔌</span>
      <span class="sidebar-nav-label">Connectors</span>
    </a>
  </div>

  <div class="sidebar-scroll">
  <div class="sidebar-section" id="sidebar-team-section">
    <div class="sidebar-section-label">
      Team <span id="sidebar-team-count" style="color:rgba(255,255,255,0.4)"></span>
      <button type="button" class="sidebar-create-wolt" onclick="openCreateWolt(event)">
        <span aria-hidden="true">+</span> Create wolt
      </button>
    </div>
    <div id="sidebar-wolts"></div>
  </div>
  </div>

  <div class="sidebar-bottom">
    <div class="sidebar-footer">
      <a href="/tui">terminal</a>
      <a href="/settings">⚙ settings</a>
    </div>
  </div>
</aside>
