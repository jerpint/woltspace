<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-name">
      <span class="brand-emoji">🦫</span>
      Woltspace
    </div>
  </div>

  <div class="sidebar-nav">
    <a class="sidebar-nav-item{% if active_nav == 'home' %} active{% endif %}" id="nav-home" href="/" onclick="showView('home');return false">
      <span class="sidebar-nav-icon">🏠</span>
      <span class="sidebar-nav-label">Home</span>
    </a>
    <a class="sidebar-nav-item{% if active_nav == 'apps' %} active{% endif %}" id="nav-apps" href="/?view=apps" onclick="showView('apps');return false">
      <span class="sidebar-nav-icon">🪓</span>
      <span class="sidebar-nav-label">Apps</span>
    </a>
    <a class="sidebar-nav-item{% if active_nav == 'sessions' %} active{% endif %}" id="nav-sessions" href="/?view=sessions" onclick="showView('sessions');return false">
      <span class="sidebar-nav-icon">🌿</span>
      <span class="sidebar-nav-label">Sessions</span>
      <span class="nav-badge" id="sessions-badge"></span>
    </a>
    <a class="sidebar-nav-item{% if active_nav == 'settings' %} active{% endif %}" id="nav-settings" href="/settings">
      <span class="sidebar-nav-icon">⚙</span>
      <span class="sidebar-nav-label">Settings</span>
    </a>
  </div>

  <div class="sidebar-scroll">
  <div class="sidebar-section" id="sidebar-team-section">
    <div class="sidebar-section-label">
      Team <span id="sidebar-team-count" style="color:rgba(255,255,255,0.4)"></span>
      <a href="#" onclick="openCreateWolt(event)">+ add wolt</a>
    </div>
    <div id="sidebar-wolts"></div>
  </div>
  </div>

  <div class="sidebar-bottom">
    <div class="creatures-toggle" onclick="toggleCreatures()">
      <span class="creatures-toggle-label">⚙ System Creatures</span>
      <span class="creatures-chevron" id="creatures-chevron">▾</span>
    </div>
    <div class="creatures-list" id="creatures-list">
      <div class="creatures-list-inner">
        <div class="creature-row">
          <span>🐺</span>
          <span class="creature-name">wolf</span>
          <span class="creature-desc">scheduler</span>
        </div>
        <div class="creature-row">
          <span>🦅</span>
          <span class="creature-name">eagle</span>
          <span class="creature-desc">reaper</span>
        </div>
      </div>
    </div>

    <div class="sidebar-footer">
      <a href="/tui">terminal</a>
      <a href="#" onclick="openOnboard();return false">onboard</a>
    </div>
  </div>
</aside>
