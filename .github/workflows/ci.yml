name: Tests and packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/container/lib
      WOLTSPACE_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tui/package-lock.json
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          python -m pip install '.[test]'
          npm ci
          npm ci --prefix tui
      - name: Focused release checks
        run: >-
          python -m pytest -q
          test/test_lodge_skills.py
          test/test_skills_sync.py
          test/test_session_target_api.py
          test/test_execution_policy.py
          test/test_auto_grants_cli.py
          test/test_backup.py
          test/test_native_doctor.py
          test/test_closed_loop.py::TestRegressions::test_notify_footer_appended
          test/test_closed_loop.py::TestRegressions::test_notify_script_executable
          test/test_closed_loop.py::TestRegressions::test_den_reply_footer_consistent
          test/test_native_resilience.py
          test/test_native_surfaces.py
          test/test_telegram_loop.py
          test/test_wolts.py::TestCredentials
      - name: Node suite
        run: npm test

  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Build packages
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Pack TUI
        working-directory: tui
        run: npm pack --pack-destination ../dist
      - name: Verify package contents and versions
        run: python scripts/verify-packages.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: packages-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
