name: Tests and packages

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/container/lib
      WOLTSPACE_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tui/package-lock.json
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          python -m pip install '.[test]'
          npm ci
          npm ci --prefix tui
      - name: Focused release checks
        run: >-
          python -m pytest -q
          test/test_release_workflow.py
          test/test_lodge_skills.py
          test/test_push_view.py
          test/test_lodge_db.py
          test/test_inbox.py
          test/test_inbox_actor.py
          test/test_session_store.py
          test/test_lodge_boot_refusal.py
          test/test_lodge_boot_import.py
          test/test_db_show_cli.py
          test/test_vulture.py
          test/test_vulture_connector.py
          test/test_session_expiry.py
          test/test_session_runtime.py
          test/test_wolf_connector.py
          test/test_skills_sync.py
          test/test_session_target_api.py
          test/test_execution_policy.py
          test/test_auto_grants_cli.py
          test/test_lodge_grants.py
          test/test_wolf_runs.py
          test/test_backup.py
          test/test_native_doctor.py
          test/test_outbox.py
          test/test_notification_types.py
          test/test_notification_senders.py
          test/test_notify_file_core.py
          test/test_notify_file_telegram.py
          test/test_notify_file_telegram_methods.py
          test/test_notify_file_route.py
          test/test_notify_destination.py
          test/test_voice_notes.py
          test/test_notify_voice_telegram.py
          test/test_notify_voice_core.py
          test/test_notify_speech.py
          test/test_notify_speak_core.py
          test/test_notify_speak_route.py
          test/test_notify_hardening.py
          test/test_closed_loop.py::TestRegressions::test_notify_footer_appended
          test/test_closed_loop.py::TestRegressions::test_notify_script_executable
          test/test_closed_loop.py::TestRegressions::test_den_reply_footer_consistent
          test/test_native_resilience.py
          test/test_native_surfaces.py
          test/test_telegram_loop.py
          test/test_telegram_media_download.py
          test/test_notify_file_slack.py
          test/test_telegram_reply_caption.py
          test/test_input_ready.py
          test/test_telegram_spawn_with_message.py
          test/test_telegram_golden.py
          test/test_telegram_messages_golden.py
          test/test_golden_store.py
          test/test_chat_lodge_dog.py
          test/test_connector_contract.py
          test/test_connector_echo.py
          test/test_connector_socket.py
          test/test_connector_e2e.py
          test/test_telegram_idle.py
          test/test_telegram_holds.py
          test/test_channel_connectors.py
          test/test_transcription_settings.py
          test/test_speech_settings.py
          test/test_boot_context_cap.py
          test/test_creature_types.py
          test/test_wolts.py::TestCredentials
          test/test_wolts.py::TestSyncClaudeMdPlatformSection
          test/test_update_cli.py
          test/test_wolt_archive.py
          test/test_wolt_archive_api.py
          test/test_wolt_archive_bots.py
          test/test_chat_state.py
          test/test_native_session_cli.py
          test/test_seed.py
          test/test_container_entrypoint.py::test_boot_never_picks_a_name_only_the_archive_holds
      - name: notify command
        # The script runs under woltspace-python, which needs a Python that
        # has the test install's dependencies.
        run: >-
          PATH="$PWD/container/bin:$PATH" WOLTSPACE_PYTHON="$(command -v python)"
          python -m pytest -q test/test_notify_cli.py
      - name: Node suite
        run: npm test

  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Build packages
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Pack TUI
        working-directory: tui
        run: npm pack --pack-destination ../dist
      - name: Verify package contents and versions
        run: python scripts/verify-packages.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: packages-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
