[project]
name = "woltspace"
version = "0.5.1"
description = "A persistent lodge for local AI agent sessions"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "httpx",
    "watchfiles",
    "python-dotenv",
    "jinja2",
    # The CLI's voice. Pure Python, no compiled extensions, one transitive
    # dependency tree already common in this stack — and it is the piece that
    # makes the lodge palette safe: it drops every escape when stdout is not a
    # terminal, so `woltspace status | cat` stays plain parseable text.
    "rich",
]

[project.scripts]
woltspace = "woltspace.cli:main"

[project.optional-dependencies]
connectors = [
    "litellm",
    "openai",
    "python-telegram-bot",
    "slack-bolt",
    "slack-sdk",
    "pyjwt[crypto]>=2.12.1",
]
test = [
    "pytest",
    "pytest-asyncio",
    "litellm",
    "openai",
    "python-telegram-bot",
    "slack-bolt",
    "slack-sdk",
    "pyjwt[crypto]>=2.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    "container/bot/test_*.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/woltspace"]

[tool.hatch.build.targets.wheel.force-include]
"server" = "woltspace/_bundle/server"
"container" = "woltspace/_bundle/container"
"public" = "woltspace/_bundle/public"
"template" = "woltspace/_bundle/template"
"templates" = "woltspace/_bundle/templates"

[tool.hatch.build.targets.sdist]
include = [
    "/src/woltspace",
    "/server",
    "/container",
    "/public",
    "/template",
    "/templates",
    "/README.md",
    "/LICENSE",
]
