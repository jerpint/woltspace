<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>woltspace</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦫</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bark:    #2a1f14;
      --log:     #3d2b1a;
      --wood:    #5c3d24;
      --amber:   #c17f3a;
      --straw:   #d4a96a;
      --cream:   #f0dfc0;
      --moss:    #4a7c59;
      --fern:    #5e9e70;
      --leaf:    #7bbf8a;
      --pond:    #2d5a6e;
      --water:   #4a8fa8;
      --muted:   #8a7060;
      --dim:     #5a4535;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bark:    #f5ede0;
        --log:     #ecdcca;
        --wood:    #dcc9b2;
        --amber:   #9a5c1a;
        --straw:   #7a4510;
        --cream:   #3d2010;
        --moss:    #2d5e3a;
        --fern:    #3a7548;
        --leaf:    #4a8a58;
        --pond:    #1a4558;
        --water:   #2a6a85;
        --muted:   #7a6050;
        --dim:     #a08878;
      }
    }

    html, body {
      min-height: 100dvh;
      background: var(--bark);
      color: var(--cream);
    }

    body {
      font-family: 'SF Mono','Fira Code','Cascadia Code','Consolas',monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.5rem 3rem;
    }

    /* ---- HEADER ---- */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .header h1 {
      font-size: 1.6rem;
      color: var(--fern);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
      cursor: default;
      user-select: none;
    }
    .header h1 span { color: var(--leaf); }

    .twister {
      font-size: 0.72rem;
      color: var(--muted);
      font-style: italic;
      max-width: 480px;
      line-height: 1.5;
      margin: 0 auto 0.5rem;
    }
    .twister em {
      color: var(--straw);
      font-style: normal;
    }

    .tagline {
      font-size: 0.7rem;
      color: var(--dim);
      letter-spacing: 0.08em;
      text-transform: lowercase;
    }

    /* ---- DIVIDER ---- */
    .divider {
      width: 100%;
      max-width: 560px;
      border: none;
      border-top: 1px solid var(--log);
      margin: 0 0 2rem;
    }

    /* ---- ONBOARD BANNER ---- */
    .onboard-banner {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--log);
      border: 1px solid var(--amber);
      border-radius: 6px;
      padding: 0.65rem 0.9rem;
      margin-bottom: 1.5rem;
      gap: 1rem;
    }
    .onboard-banner span {
      font-size: 0.72rem;
      color: var(--straw);
    }
    .onboard-banner button {
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.35rem 0.9rem;
      background: var(--amber);
      border: none;
      border-radius: 4px;
      color: var(--bark);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .onboard-banner button:hover { background: var(--straw); }

    /* ---- PROMPT ---- */
    .prompt-box {
      width: 100%;
      max-width: 560px;
      margin-bottom: 2.5rem;
    }
    .prompt-label {
      font-size: 0.65rem;
      color: var(--dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .prompt-box form {
      display: flex;
      gap: 0.5rem;
    }
    .prompt-box input {
      flex: 1;
      background: var(--log);
      border: 1px solid var(--wood);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      color: var(--cream);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .prompt-box input:focus {
      border-color: var(--amber);
    }
    .prompt-box input::placeholder {
      color: var(--dim);
    }
    .prompt-box button {
      background: var(--moss);
      border: 1px solid var(--fern);
      border-radius: 6px;
      padding: 0.75rem 1.4rem;
      color: var(--cream);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    .prompt-box button:hover {
      background: var(--fern);
      border-color: var(--leaf);
    }
    .prompt-box button:disabled {
      background: var(--log);
      border-color: var(--wood);
      color: var(--dim);
      cursor: not-allowed;
    }

    /* ---- WOLTS ---- */
    .wolts {
      width: 100%;
      max-width: 560px;
      margin-bottom: 2rem;
    }
    .wolts-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .wolts h2 {
      font-size: 0.65rem;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .wolts-count {
      font-size: 0.6rem;
      background: var(--log);
      color: var(--muted);
      border-radius: 10px;
      padding: 0.1rem 0.5rem;
    }
    .wolt-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.5rem;
    }
    .wolt-card {
      background: var(--log);
      border: 1px solid var(--wood);
      border-radius: 6px;
      padding: 0.75rem;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, background 0.15s;
      cursor: pointer;
    }
    .wolt-card:hover {
      border-color: var(--amber);
      background: var(--wood);
    }
    .wolt-card-top {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
    }
    .wolt-emoji {
      font-size: 1.2rem;
      line-height: 1;
    }
    .wolt-name {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--cream);
    }
    .wolt-role {
      font-size: 0.65rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .wolt-card.passive {
      opacity: 0.6;
      cursor: default;
    }
    .wolt-card.passive:hover {
      border-color: var(--wood);
      background: var(--log);
    }
    .wolt-type-tag {
      font-size: 0.58rem;
      color: var(--dim);
      margin-top: 0.3rem;
      font-style: italic;
    }

    /* ---- SESSIONS ---- */
    .sessions {
      width: 100%;
      max-width: 560px;
    }
    .sessions-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .sessions h2 {
      font-size: 0.65rem;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .sessions-count {
      font-size: 0.6rem;
      background: var(--log);
      color: var(--muted);
      border-radius: 10px;
      padding: 0.1rem 0.5rem;
    }

    .session-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .session-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--log);
      border: 1px solid var(--wood);
      border-radius: 6px;
      padding: 0.65rem 0.9rem;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, background 0.15s;
    }
    .session-item:hover {
      border-color: var(--amber);
      background: var(--wood);
    }
    .session-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      min-width: 0;
    }
    .session-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .session-dot.running  { background: var(--leaf); box-shadow: 0 0 6px var(--leaf); }
    .session-dot.completed { background: var(--dim); }
    .session-dot.failed   { background: #c0392b; }
    .session-name {
      font-size: 0.72rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 2px;
    }
    .session-title {
      font-size: 0.82rem;
      color: var(--cream);
      line-height: 1.3;
    }
    .session-meta {
      font-size: 0.68rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    .empty {
      font-size: 0.78rem;
      color: var(--dim);
      text-align: center;
      padding: 2rem;
      border: 1px dashed var(--wood);
      border-radius: 6px;
    }

    /* ---- MOBILE ---- */
    @media (max-width: 600px) {
      body { padding: 1.5rem 1rem 2rem; }

      .prompt-box input,
      .prompt-box button { font-size: 1rem; } /* prevent iOS zoom on tap */

      .session-item {
        padding: 0.85rem 0.9rem;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 0.25rem;
      }
      .session-left { flex: 1; min-width: 0; }
      .session-title { white-space: normal; } /* wrap on mobile */
      .session-meta {
        width: 100%;
        padding-left: 1.3rem; /* align past the dot */
        margin-top: 0.15rem;
      }
    }

    /* ---- FOOTER ---- */
    .footer {
      margin-top: 3rem;
      font-size: 0.62rem;
      color: var(--dim);
      text-align: center;
      letter-spacing: 0.05em;
    }
    .footer a {
      color: var(--muted);
      text-decoration: none;
    }
    .footer a:hover { color: var(--amber); }

    /* ---- BEAVERS RAIN ---- */
    @keyframes beavFall {
      to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 id="wolt-name" style="visibility:hidden">🦫</h1>
    <p class="twister">
      "how much wolt could a <em>wolt chuck</em> chuck<br>
      if a wolt chuck could chuck <em>wolt</em>?"
    </p>
    <div class="tagline">gnaw first. ask questions later.</div>
  </div>

  <hr class="divider">

  <div class="onboard-banner" id="onboard-banner" style="display:none">
    <span>claude code isn't authenticated yet.</span>
    <button onclick="openOnboard()">onboard →</button>
  </div>

  <div class="prompt-box">
    <div class="prompt-label">new session</div>
    <form id="prompt-form">
      <input type="text" id="prompt-input" placeholder="what should we gnaw on today?" autocomplete="off" autofocus>
      <button type="submit" id="submit-btn">gnaw →</button>
    </form>
  </div>

  <div class="wolts">
    <div class="wolts-header">
      <h2>your wolts</h2>
      <span class="wolts-count" id="wolts-count">–</span>
    </div>
    <div class="wolt-grid" id="wolt-grid">
      <div class="empty">loading...</div>
    </div>
  </div>

  <div class="sessions">
    <div class="sessions-header">
      <h2>sessions</h2>
      <span class="sessions-count" id="sessions-count">–</span>
    </div>
    <div class="session-list" id="session-list">
      <div class="empty">loading...</div>
    </div>
  </div>

  <div class="footer">
    🦫 woltspace &nbsp;·&nbsp;
    <a href="/tui">open terminal</a> &nbsp;·&nbsp;
    <a href="#" onclick="openOnboard();return false;">onboard</a> &nbsp;·&nbsp;
    <a href="/status">status</a>
  </div>

  <script>
    const listEl  = document.getElementById('session-list');
    const countEl = document.getElementById('sessions-count');
    const form    = document.getElementById('prompt-form');
    const input   = document.getElementById('prompt-input');
    const btn     = document.getElementById('submit-btn');

    // Show onboard banner only if not authenticated
    fetch('/onboard-status').then(r => r.json()).then(d => {
      if (!d.has_oauth) document.getElementById('onboard-banner').style.display = '';
    }).catch(() => {});

    // Load wolt name
    const h1 = document.getElementById('wolt-name');
    fetch('/status').then(r => r.json()).then(d => {
      h1.innerHTML = '🦫 ' + (d.wolt || 'woltspace');
      h1.style.visibility = '';
      if (d.wolt) {
        document.title = d.wolt;
      }
    }).catch(() => {
      h1.innerHTML = '🦫 woltspace';
      h1.style.visibility = '';
    });

    function timeAgo(ts) {
      const s = Math.floor((Date.now() / 1000) - ts);
      if (s < 60) return 'just now';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      return Math.floor(s / 86400) + 'd ago';
    }

    async function loadSessions() {
      try {
        const res = await fetch('/sessions');
        const sessions = await res.json();
        const filtered = sessions.filter(s => s.name !== 'main');
        countEl.textContent = filtered.length || '0';
        if (!filtered.length) {
          listEl.innerHTML = '<div class="empty">no sessions yet — type a prompt above to start one</div>';
          return;
        }
        listEl.innerHTML = filtered.map(s => {
          const status = s.status || 'running';
          const dot  = `<span class="session-dot ${status}"></span>`;
          const time = s.last_activity ? timeAgo(s.last_activity) : (s.created_at ? timeAgo(s.created_at) : '');
          const mainLabel = s.title
            ? `<div class="session-title">${s.title}</div><span class="session-name">${s.name}</span>`
            : `<div class="session-title">${s.name}</div>`;
          return `<a class="session-item" href="/tui?session=${encodeURIComponent(s.name)}">
            <div class="session-left">${dot}<div>${mainLabel}</div></div>
            <span class="session-meta">${status} · ${time}</span>
          </a>`;
        }).join('');
      } catch {
        listEl.innerHTML = '<div class="empty">failed to load sessions</div>';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = input.value.trim();
      if (!prompt) return;
      btn.disabled = true;
      btn.textContent = 'gnawing...';
      try {
        const res = await fetch('/sessions/new', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });
        const data = await res.json();
        if (data.name) {
          window.location.href = '/tui?session=' + encodeURIComponent(data.name);
        }
      } catch {
        btn.disabled = false;
        btn.textContent = 'gnaw →';
      }
    });

    const WOLT_EMOJI = {
      raccoon: '🦝', beaver: '🦫', otter: '🦦', rodent: '🦝',
      wolf: '🐺', dog: '🐕',
    };
    const RODENT_TYPES = new Set(['raccoon', 'beaver', 'otter', 'rodent']);
    const WOLT_TYPE_HINT = {
      wolf: 'scheduler — wakes up rodents on a timer',
      dog: 'companion — lives on telegram & slack',
    };
    const TIER_LABEL = {
      raccoon: 'opus', beaver: 'sonnet', otter: 'haiku', rodent: 'opus',
    };

    const woltGrid = document.getElementById('wolt-grid');
    const woltsCount = document.getElementById('wolts-count');

    async function loadWolts() {
      try {
        const res = await fetch('/wolts');
        const wolts = await res.json();
        woltsCount.textContent = wolts.length || '0';
        if (!wolts.length) {
          woltGrid.innerHTML = '<div class="empty">no wolts yet</div>';
          return;
        }
        // Rodents first (raccoon > beaver > otter), then others
        const tierOrder = { raccoon: 0, rodent: 0, beaver: 1, otter: 2 };
        const sorted = [...wolts].sort((a, b) => {
          const aRodent = RODENT_TYPES.has(a.type) ? 0 : 1;
          const bRodent = RODENT_TYPES.has(b.type) ? 0 : 1;
          if (aRodent !== bRodent) return aRodent - bRodent;
          return (tierOrder[a.type] ?? 99) - (tierOrder[b.type] ?? 99);
        });
        woltGrid.innerHTML = sorted.map(w => {
          const emoji = WOLT_EMOJI[w.type] || '🦫';
          const role = w.role || '';
          const isRodent = RODENT_TYPES.has(w.type);
          const hint = WOLT_TYPE_HINT[w.type] || '';
          const tier = TIER_LABEL[w.type];
          const cls = isRodent ? 'wolt-card' : 'wolt-card passive';
          const click = isRodent ? `onclick="startWoltSession('${w.name}')"` : '';
          return `<div class="${cls}" ${click}>
            <div class="wolt-card-top">
              <span class="wolt-emoji">${emoji}</span>
              <span class="wolt-name">${w.name}</span>
            </div>
            <div class="wolt-role">${role}</div>
            ${tier ? `<div class="wolt-type-tag">${w.type === 'rodent' ? 'raccoon' : w.type} · ${tier}</div>` : ''}
            ${hint ? `<div class="wolt-type-tag">${hint}</div>` : ''}
          </div>`;
        }).join('');
      } catch {
        woltGrid.innerHTML = '<div class="empty">failed to load wolts</div>';
      }
    }

    function startWoltSession(name) {
      input.value = '';
      input.placeholder = `talking to ${name}...`;
      fetch('/sessions/new', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: `hey ${name}` }),
      }).then(r => r.json()).then(data => {
        if (data.name) window.location.href = '/tui?session=' + encodeURIComponent(data.name);
      }).catch(() => {
        input.placeholder = 'what should we gnaw on today?';
      });
    }

    loadWolts();
    loadSessions();
    setInterval(loadSessions, 5000);

    // 🦫 click the name 5× for beaver rain
    let bClicks = 0, bTimer;
    h1.style.cursor = 'default';
    h1.addEventListener('click', () => {
      bClicks++;
      clearTimeout(bTimer);
      bTimer = setTimeout(() => { bClicks = 0; }, 1500);
      if (bClicks >= 5) {
        bClicks = 0;
        document.querySelector('.twister').innerHTML =
          '"<em>wolt wolt wolt wolt</em> wolt wolt wolt wolt<br>wolt wolt wolt <em>wolt</em> wolt wolt wolt"';
        for (let i = 0; i < 30; i++) {
          setTimeout(() => {
            const b = document.createElement('div');
            b.textContent = '🦫';
            b.style.cssText = `position:fixed;font-size:${1+Math.random()*2.5}rem;left:${Math.random()*100}vw;top:-2rem;animation:beavFall ${1.5+Math.random()*2.5}s linear forwards;pointer-events:none;z-index:9999;`;
            document.body.appendChild(b);
            setTimeout(() => b.remove(), 5000);
          }, i * 80);
        }
      }
    });

    async function openOnboard() {
      await fetch('/current?session=main', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: '/onboard' }),
      }).catch(() => {});
      location.href = '/tui';
    }

    console.log('%c🦫', 'font-size:3rem');
    console.log('%cwoltspace\nhow much wolt could a wolt chuck chuck\nif a wolt chuck could chuck wolt?', 'color:#c17f3a;font-family:monospace');
  </script>
</body>
</html>
