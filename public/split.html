<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>woltspace</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦫</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bark:   #2a1f14;
      --log:    #3d2b1a;
      --wood:   #5c3d24;
      --amber:  #c17f3a;
      --straw:  #d4a96a;
      --cream:  #f0dfc0;
      --moss:   #4a7c59;
      --fern:   #5e9e70;
      --leaf:   #7bbf8a;
      --water:  #4a8fa8;
      --muted:  #8a7060;
      --dim:    #5a4535;
    }

    html, body { height: 100dvh; overflow: hidden; background: var(--bark); }
    body { display: flex; flex-direction: column; }

    #topbar {
      background: var(--log);
      border-bottom: 1px solid var(--wood);
      padding: 0.4rem 0.75rem;
      display: flex; align-items: center; justify-content: space-between;
      font-family: 'SF Mono','Fira Code',monospace;
      font-size: 0.8rem; flex-shrink: 0;
    }
    #topbar .left { display: flex; align-items: center; gap: 0.4rem; }
    #topbar .title { color: var(--leaf); font-weight: 600; }
    #topbar .status { color: var(--muted); font-size: 0.65rem; }
    #topbar .actions { display: flex; gap: 0.4rem; }

    /* project bar — shown when right pane is viewing a project */
    #project-bar {
      display: none;
      align-items: center;
      gap: 0.4rem;
      border-left: 1px solid var(--wood);
      padding-left: 0.6rem;
      margin-left: 0.2rem;
    }
    #project-bar.visible { display: flex; }
    #project-bar .p-emoji { font-size: 0.9rem; }
    #project-bar .p-name { font-size: 0.75rem; font-weight: 600; color: var(--cream); }
    #project-bar .p-dot { width: 6px; height: 6px; border-radius: 50%; }
    #project-bar .p-dot.on  { background: var(--leaf); box-shadow: 0 0 5px var(--leaf); }
    #project-bar .p-dot.off { background: var(--dim); }
    #project-bar .p-toggle {
      font-family: inherit; font-size: 0.65rem; font-weight: 600;
      padding: 0.2rem 0.5rem; border-radius: 4px; cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      background: transparent;
    }
    #project-bar .p-toggle.start { border: 1px solid var(--fern); color: var(--leaf); }
    #project-bar .p-toggle.start:hover { background: var(--moss); color: var(--cream); }
    #project-bar .p-toggle.stop  { border: 1px solid var(--wood); color: var(--muted); }
    #project-bar .p-toggle.stop:hover  { border-color: #c0392b; color: #e74c3c; }
    #topbar .actions button {
      font-family: inherit; font-size: 0.72rem;
      padding: 0.25rem 0.6rem; background: var(--log);
      border: 1px solid var(--wood); border-radius: 4px;
      color: var(--muted); cursor: pointer; white-space: nowrap;
    }
    #topbar .actions button:hover { border-color: var(--leaf); color: var(--cream); }
    #topbar .actions button:disabled { opacity: 0.3; cursor: default; border-color: var(--wood); color: var(--dim); }
    #topbar .actions button.active { border-color: var(--leaf); color: var(--leaf); }
    #btn-share.copied { border-color: var(--leaf); color: var(--bark); background: var(--leaf); }

    /* history panel */
    #right { position: relative; }
    #hist-panel {
      position: absolute; top: 0; right: 0; bottom: 0; width: 220px;
      background: var(--log); border-left: 1px solid var(--wood);
      display: flex; flex-direction: column;
      z-index: 50; transform: translateX(100%);
      transition: transform 0.2s ease;
      font-family: 'SF Mono','Fira Code',monospace;
    }
    #hist-panel.open { transform: translateX(0); }
    #hist-header {
      padding: 0.4rem 0.75rem; border-bottom: 1px solid var(--wood);
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.7rem; color: var(--muted); flex-shrink: 0;
    }
    #hist-header button {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 0.9rem; padding: 0; line-height: 1;
    }
    #hist-header button:hover { color: var(--cream); }
    #hist-list { flex: 1; overflow-y: auto; padding: 0.25rem 0; }
    #hist-list::-webkit-scrollbar { width: 4px; }
    #hist-list::-webkit-scrollbar-thumb { background: var(--wood); border-radius: 2px; }
    .hist-item {
      padding: 0.45rem 0.75rem; cursor: pointer;
      border-bottom: 1px solid #5c3d2411;
      transition: background 0.1s;
    }
    .hist-item:hover { background: var(--wood); }
    .hist-item.current { background: #2d4030; }
    .hist-title { display: block; font-size: 0.72rem; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hist-time  { display: block; font-size: 0.62rem; color: var(--dim); margin-top: 1px; }

    #split {
      flex: 1; display: flex; overflow: hidden;
    }

    #left {
      width: 50%;
      display: flex; flex-direction: column; overflow: hidden;
      transition: width 0.2s ease;
    }

    #right {
      width: 50%; display: flex; flex-direction: column; overflow: hidden;
      transition: width 0.2s ease;
    }

    #drag-handle {
      width: 4px; flex-shrink: 0;
      background: var(--wood); cursor: col-resize;
      position: relative; touch-action: none; z-index: 10;
      transition: background 0.15s;
    }
    #drag-handle:hover, #drag-handle.dragging { background: var(--moss); }
    #drag-handle::before { content: ''; position: absolute; inset: 0 -6px; }

    #split.left-full  #left  { width: 100%; }
    #split.left-full  #right { width: 0; overflow: hidden; }
    #split.right-full #left  { width: 0; overflow: hidden; }
    #split.right-full #right { width: 100%; }

    #terminal { flex: 1; overflow: hidden; }
    .xterm { height: 100%; }

    @media (max-width: 768px) {
      #drag-handle { display: none; }
      #split #left  { width: 100%; }
      #split #right { width: 0; overflow: hidden; }
      #split.right-full #left  { width: 0 !important; overflow: hidden; }
      #split.right-full #right { width: 100% !important; }

      /* topbar: title row + actions row */
      #topbar {
        flex-wrap: wrap;
        row-gap: 0.4rem;
        padding: 0.5rem 0.75rem;
      }
      #topbar .left {
        flex: 1;
        min-width: 0;
      }
      #topbar .title {
        font-size: 0;        /* hide text */
        display: inline-flex;
        align-items: center;
        min-width: 44px;
        min-height: 44px;
        justify-content: center;
      }
      #topbar .title::before {
        content: '🦫';
        font-size: 1.4rem;
      }
      #topbar .actions {
        width: 100%;
        gap: 0.3rem;
      }
      #topbar .actions button {
        flex: 1;
        padding: 0.5rem 0.25rem;
        font-size: 0.7rem;
        text-align: center;
      }
    }

    #preview { flex: 1; border: none; background: var(--bark); display: block; }
  </style>
</head>
<body>
  <div id="topbar">
    <div class="left">
      <a class="title" href="/" id="session-name" style="text-decoration:none">🦫 woltspace</a>
      <span class="status" id="tui-status">connecting...</span>
    </div>
    <div id="project-bar">
      <span class="p-emoji" id="p-emoji"></span>
      <span class="p-name" id="p-name"></span>
      <span class="p-dot" id="p-dot"></span>
      <button class="p-toggle" id="p-toggle" onclick="toggleCurrentProject()"></button>
    </div>
    <div class="actions">
      <button id="btn-back"    onclick="goBack()"            title="Back" disabled>◁</button>
      <button id="btn-share"   onclick="copyPublicLink()"    title="Copy public live link">↗ share</button>
      <button id="btn-term"    onclick="toggleFull('left')"  title="Fullscreen terminal">⬛ term</button>
      <button id="btn-preview" onclick="toggleFull('right')" title="View">⬛ view</button>
    </div>
  </div>

  <div id="split">
    <div id="left">
      <div id="terminal"></div>
    </div>
    <div id="drag-handle"></div>
    <div id="right">
      <iframe id="preview" src="/placeholder.html"></iframe>
      <div id="hist-panel">
        <div id="hist-header">
          <span>views</span>
          <button onclick="toggleHist()">✕</button>
        </div>
        <div id="hist-list"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { Terminal }     from 'https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/+esm';
    import { FitAddon }     from 'https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/+esm';
    import { WebLinksAddon } from 'https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/+esm';

    // ── Session ───────────────────────────────────────────────────────────────
    const session = new URLSearchParams(location.search).get('session') || 'main';
    document.getElementById('session-name').textContent = session === 'main' ? document.getElementById('session-name').textContent : session;
    document.title = session === 'main' ? document.title : `${session} · tui`;

    const preview = document.getElementById('preview');

    // ── Terminal ──────────────────────────────────────────────────────────────
    const statusEl = document.getElementById('tui-status');
    const term = new Terminal({
      cursorBlink: true, fontSize: 13,
      fontFamily: "'SF Mono','Fira Code','Consolas',monospace",
      theme: {
        background: '#2a1f14', foreground: '#f0dfc0', cursor: '#c17f3a',
        selectionBackground: '#4a7c59',
        black: '#2a1f14', red: '#c0392b',  green: '#7bbf8a',
        yellow: '#d4a96a', blue: '#4a8fa8', magenta: '#c678dd',
        cyan: '#5e9e70',  white: '#f0dfc0',
      },
    });

    const fitAddon = new FitAddon();
    term.loadAddon(fitAddon);
    term.loadAddon(new WebLinksAddon());
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    // Enable mobile autocorrect — xterm uses a hidden textarea for input;
    // mobile keyboards disable autocorrect on it by default.
    const xtermTextarea = document.querySelector('.xterm-helper-textarea');
    if (xtermTextarea) {
      xtermTextarea.setAttribute('autocorrect', 'on');
      xtermTextarea.setAttribute('autocapitalize', 'sentences');
      xtermTextarea.setAttribute('spellcheck', 'true');
    }

    let ws = null;
    function connectTUI() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(proto + '//' + location.host + '/tui?session=' + encodeURIComponent(session));
      ws.onopen = () => {
        statusEl.textContent = 'connected';
        statusEl.style.color = '#7bbf8a';
        ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
      };
      ws.onmessage = (e) => term.write(e.data);
      ws.onclose = () => {
        statusEl.textContent = 'reconnecting...';
        statusEl.style.color = '#f66';
        setTimeout(connectTUI, 2000);
      };
      ws.onerror = () => ws.close();
    }

    term.onData(d => ws?.readyState === WebSocket.OPEN && ws.send(d));
    term.onResize(({ cols, rows }) => {
      if (ws?.readyState === WebSocket.OPEN)
        ws.send(JSON.stringify({ type: 'resize', cols, rows }));
    });

    window.addEventListener('resize', () => fitAddon.fit());
    new ResizeObserver(() => fitAddon.fit()).observe(document.getElementById('terminal'));
    // ensure fit after mobile CSS applies on first paint
    setTimeout(() => fitAddon.fit(), 100);

    // touch scroll → send mouse wheel escape sequences to tmux
    if ('ontouchstart' in window) {
      let lastTouchY = 0;
      const termEl = document.getElementById('terminal');
      termEl.addEventListener('touchstart', e => {
        lastTouchY = e.touches[0].clientY;
      }, { passive: true });
      termEl.addEventListener('touchmove', e => {
        const dy = lastTouchY - e.touches[0].clientY;
        lastTouchY = e.touches[0].clientY;
        const lines = Math.round(Math.abs(dy) / 25);
        if (lines === 0 || ws?.readyState !== WebSocket.OPEN) return;
        // SGR mouse: button 64 = wheel up, 65 = wheel down
        const seq = dy > 0 ? '\x1b[<65;1;1M' : '\x1b[<64;1;1M';
        for (let i = 0; i < lines; i++) ws.send(seq);
      }, { passive: true });
    }
    // Auto-resume dead sessions before connecting TUI
    async function ensureSessionAlive() {
      if (session === 'main') { connectTUI(); return; }
      try {
        const res = await fetch('/sessions');
        const sessions = await res.json();
        const s = sessions.find(x => x.name === session);
        if (s && s.status === 'running' && s.alive) {
          connectTUI();
        } else if (s) {
          statusEl.textContent = 'resuming session...';
          statusEl.style.color = '#c17f3a';
          const r = await fetch('/sessions/' + encodeURIComponent(session) + '/resume', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: '' }),
          });
          const result = await r.json();
          if (result.error) {
            statusEl.textContent = 'resume failed';
            statusEl.style.color = '#f66';
          } else {
            // Give tmux a moment to start
            await new Promise(ok => setTimeout(ok, 1500));
            connectTUI();
          }
        } else {
          statusEl.textContent = 'session not found';
          statusEl.style.color = '#f66';
        }
      } catch {
        // Fallback: just try connecting
        connectTUI();
      }
    }
    ensureSessionAlive();

    // ── Right pane: views + history ───────────────────────────────────────────
    const btnBack  = document.getElementById('btn-back');
    const btnHist  = document.getElementById('btn-hist');
    const histPanel = document.getElementById('hist-panel');
    const histList  = document.getElementById('hist-list');

    let lastUrl   = null;
    let viewStack = [];   // [{url, title, t}]
    let stackIdx  = -1;
    let histOpen  = false;
    let currentViewportMeta = null; // latest metadata from /current/meta

    function timeAgo(ts) {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 60)    return 'just now';
      if (s < 3600)  return Math.floor(s / 60) + 'm ago';
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      return Math.floor(s / 86400) + 'd ago';
    }

    let allSparks = [];

    function renderHist() {
      // Show all sparks (digests, etc.) as browsable catalog
      histList.innerHTML = allSparks.map(s => {
        const isCurrent = lastUrl === '/history/' + s.id;
        return `<div class="hist-item${isCurrent ? ' current' : ''}" onclick="loadSpark('${s.id}', '${(s.title||'').replace(/'/g,"\\'")}')">
          <span class="hist-title">${s.title}</span>
          <span class="hist-time">${timeAgo(new Date(s.timestamp).getTime())}</span>
        </div>`;
      }).join('');
    }

    window.loadSpark = (id, title) => {
      const url = '/history/' + id;
      loadView(url, title);
      setCurrent(url);
    };

    function updateBackBtn() {
      btnBack.disabled = stackIdx <= 0;
    }

    // ── Project bar ───────────────────────────────────────────────────────────
    const projectBar = document.getElementById('project-bar');
    let currentProjectName = null;

    // Detect project/site from viewport metadata rather than URL path matching.
    // When viewport_port != 7777, look up the project by port from /projects list.
    async function updateProjectBar(url) {
      // Check for wolt site URL
      const siteMatch = url.match(/^\/wolt\/([^/]+)\/site/);
      if (siteMatch) {
        const woltName = siteMatch[1];
        document.getElementById('p-emoji').textContent = '🦝';
        document.getElementById('p-name').textContent = woltName;
        document.getElementById('p-dot').className = 'p-dot on';
        document.getElementById('p-toggle').style.display = 'none';
        currentProjectName = null;
        projectBar.classList.add('visible');
        return;
      }

      // Resolve project name — prefer metadata port lookup over URL path matching
      let projectName = null;
      const meta = currentViewportMeta;
      if (meta && meta.port && meta.port !== 7777) {
        try {
          const projects = await fetch('/projects').then(r => r.json());
          const proj = projects.find(p => p.port === meta.port);
          if (proj) projectName = proj.name;
        } catch {}
      }
      if (!projectName) {
        const projectMatch = url.match(/^\/project\/([^/]+)/);
        if (projectMatch) projectName = projectMatch[1];
      }

      if (!projectName) {
        projectBar.classList.remove('visible');
        currentProjectName = null;
        return;
      }

      currentProjectName = projectName;
      try {
        const p = await fetch('/projects/' + projectName).then(r => r.json());
        document.getElementById('p-emoji').textContent = p.emoji || '📦';
        document.getElementById('p-name').textContent = p.name;
        const dot = document.getElementById('p-dot');
        dot.className = 'p-dot ' + (p.running ? 'on' : 'off');
        const btn = document.getElementById('p-toggle');
        if (p.start) {
          btn.textContent = p.running ? 'stop' : 'start';
          btn.className = 'p-toggle ' + (p.running ? 'stop' : 'start');
          btn.style.display = '';
        } else {
          btn.style.display = 'none';
        }
        projectBar.classList.add('visible');
      } catch {
        projectBar.classList.remove('visible');
        currentProjectName = null;
      }
    }

    // Are we on localhost? Direct port URLs only work locally.
    const isLocal = ['localhost', '127.0.0.1', '0.0.0.0'].includes(location.hostname);

    // Build a direct port URL — only works on localhost.
    // When remote (tunnel), returns null so callers can fall back.
    function directPortUrl(port, subPath) {
      if (!isLocal) return null;
      return location.protocol + '//' + location.hostname + ':' + port + (subPath || '/');
    }

    window.toggleCurrentProject = async () => {
      if (!currentProjectName) return;
      const btn = document.getElementById('p-toggle');
      const isRunning = btn.classList.contains('stop');
      btn.disabled = true;
      btn.textContent = '...';
      try {
        const result = await fetch(
          '/projects/' + currentProjectName + '/' + (isRunning ? 'stop' : 'start'),
          { method: 'POST' }
        ).then(r => r.json());

        if (!isRunning && result.port) {
          // Project just started — load direct port URL (localhost) or fallback path
          const direct = directPortUrl(result.port);
          preview.src = direct || '/project/' + currentProjectName + '/';
          // Update session so pollCurrent doesn't fight us
          setCurrent('/project/' + currentProjectName + '/', result.port);
          if (currentViewportMeta) currentViewportMeta.port = result.port;
        } else {
          // Project stopped — show static fallback
          preview.src = '/project/' + currentProjectName + '/';
          setCurrent('/project/' + currentProjectName + '/');
          if (currentViewportMeta) currentViewportMeta.port = 7777;
        }
        await updateProjectBar('/project/' + currentProjectName + '/');
      } catch {}
      btn.disabled = false;
    };

    function loadView(url, title, pushToStack = true) {
      // When viewport_port != 7777, try direct port URL (localhost only).
      // When remote, check for project tunnel_url, else fall back to /project/ path
      // (which does a 302 redirect to the direct port when running).
      const meta = currentViewportMeta;
      if (meta && meta.port && meta.port !== 7777 && url && url.startsWith('/project/')) {
        const direct = directPortUrl(meta.port);
        if (direct) {
          preview.src = direct;
        } else if (meta.tunnel_url) {
          preview.src = meta.tunnel_url;
        } else {
          preview.src = url; // /project/{name}/ — server does 302 redirect
        }
      } else {
        preview.src = url;
      }
      lastUrl = url;
      if (pushToStack) {
        viewStack.splice(stackIdx + 1);
        viewStack.push({ url, title, t: Date.now() });
        stackIdx = viewStack.length - 1;
      }
      updateBackBtn();
      renderHist();
      updateProjectBar(url);
    }

    // Tell server what we're viewing so the poll doesn't fight us
    function setCurrent(url, port) {
      const body = { url };
      if (port != null) body.port = port;
      fetch('/current?session=' + encodeURIComponent(session), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      }).catch(() => {});
    }

    window.goBack = () => {
      if (stackIdx > 0) {
        stackIdx--;
        const e = viewStack[stackIdx];
        lastUrl = e.url;
        // Clear port meta so we don't apply stale direct-port logic
        currentViewportMeta = null;
        preview.src = e.url;
        setCurrent(e.url);
        updateBackBtn();
        renderHist();
      }
    };

    window.jumpTo = (i) => {
      if (i >= 0 && i < viewStack.length) {
        stackIdx = i;
        const e = viewStack[i];
        lastUrl = e.url;
        preview.src = e.url;
        setCurrent(e.url);
        updateBackBtn();
        renderHist();
      }
    };

    window.toggleHist = () => {
      histOpen = !histOpen;
      histPanel.classList.toggle('open', histOpen);
      btnHist.classList.toggle('active', histOpen);
      if (histOpen) renderHist();
    };

    window.copyPublicLink = async () => {
      const btn = document.getElementById('btn-share');
      btn.textContent = '…';
      btn.disabled = true;
      try {
        const res = await fetch('/shares', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session }),
        });
        const data = await res.json();
        if (!data.token) throw new Error(data.error || 'no token');
        const link = location.origin + data.url;
        await navigator.clipboard.writeText(link).catch(() => window.open(link, '_blank'));
        btn.disabled = false;
        btn.textContent = '✓ copied';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '↗ share'; btn.classList.remove('copied'); }, 3000);
      } catch (err) {
        console.error('[share]', err);
        btn.textContent = '↗ share';
        btn.disabled = false;
      }
    };

    // Load all sparks for the history panel
    fetch('/history').then(r => r.json()).then(sparks => {
      allSparks = sparks; // already sorted newest-first
      renderHist();
    }).catch(() => {});

    async function pollCurrent() {
      try {
        const data = await fetch('/current/meta?session=' + encodeURIComponent(session)).then(r => r.json());
        if (data.redirect) {
          location.replace('/tui?session=' + encodeURIComponent(data.redirect));
          return;
        }
        if (data.url && data.url !== lastUrl) {
          currentViewportMeta = data;
          const title = data.url.split('/').pop().replace('.html','').replace(/-/g,' ') || data.url;
          loadView(data.url, title);
        }
      } catch {}
    }
    pollCurrent();
    setInterval(pollCurrent, 2000);

    // ── Drag to resize ────────────────────────────────────────────────────────
    const leftPane   = document.getElementById('left');
    const rightPane  = document.getElementById('right');
    const dragHandle = document.getElementById('drag-handle');
    let dragging = false;

    dragHandle.addEventListener('pointerdown', e => {
      if (split.classList.contains('left-full') || split.classList.contains('right-full')) return;
      dragging = true;
      dragHandle.setPointerCapture(e.pointerId);
      dragHandle.classList.add('dragging');
      leftPane.style.transition  = 'none';
      rightPane.style.transition = 'none';
      e.preventDefault();
    });

    dragHandle.addEventListener('pointermove', e => {
      if (!dragging) return;
      const rect  = split.getBoundingClientRect();
      const ratio = Math.max(0.15, Math.min(0.85, (e.clientX - rect.left) / rect.width));
      leftPane.style.width  = (ratio * 100).toFixed(1) + '%';
      rightPane.style.width = ((1 - ratio) * 100).toFixed(1) + '%';
      fitAddon.fit();
    });

    dragHandle.addEventListener('pointerup', () => {
      if (!dragging) return;
      dragging = false;
      dragHandle.classList.remove('dragging');
      leftPane.style.transition  = '';
      rightPane.style.transition = '';
      fitAddon.fit();
    });

    // ── Fullscreen toggle ─────────────────────────────────────────────────────
    const split      = document.getElementById('split');
    const btnTerm    = document.getElementById('btn-term');
    const btnPreview = document.getElementById('btn-preview');

    window.toggleFull = (side) => {
      leftPane.style.width  = '';
      rightPane.style.width = '';
      const cls   = side === 'left' ? 'left-full' : 'right-full';
      const other = side === 'left' ? 'right-full' : 'left-full';
      if (window.innerWidth <= 768) {
        // mobile: CSS default is terminal-full, right-full class shows preview
        if (side === 'right') split.classList.add('right-full');
        else split.classList.remove('right-full');
      } else {
        if (split.classList.contains(cls)) {
          split.classList.remove(cls);
          btnTerm.textContent    = '⬛ term';
          btnPreview.textContent = '⬛ view';
        } else {
          split.classList.remove(other);
          split.classList.add(cls);
          btnTerm.textContent    = side === 'left'  ? '◧ split' : '⬛ term';
          btnPreview.textContent = side === 'right' ? '◨ split' : '⬛ view';
        }
      }
      setTimeout(() => fitAddon.fit(), 250);
    };

    // ── View mode from URL ─────────────────────────────────────────────────────
    if (new URLSearchParams(location.search).get('view') === 'session')
      toggleFull('right');
  </script>
</body>
</html>
